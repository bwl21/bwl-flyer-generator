<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown to PDFme Viewer</title>
  <!-- Load all dependencies from local files -->
  <script src="marked.min.js"></script>
  <script src="pdf-lib.min.js"></script>
  <script src="pdfme-generator.min.js"></script>
  <script src="pdfme-ui.min.js"></script>
  <script src="node_modules/html2canvas/dist/html2canvas.min.js"></script>
  <style>
      body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; height: 100vh; display: flex; }
      .editor { flex: 1; padding: 20px; border-right: 1px solid #eee; overflow: auto; background: #f8f9fa; }
      .preview { flex: 1; position: relative; background: white; }
      textarea { width: 100%; height: 100%; border: none; outline: none; font-family: monospace; font-size: 14px; resize: none; padding: 10px; box-sizing: border-box; }
      #pdfContainer { width: 100%; height: 100%; border: none; }
      h1 { font-size: 24px; margin: 0 0 10px 0; }
      label { display: block; margin-bottom: 10px; font-weight: 500; }
      .status { position: absolute; bottom: 10px; right: 10px; font-size: 12px; color: #666; }
  </style>
</head>
<body>
<div class="editor">
  <label>Markdown Input:</label>
  <textarea id="markdown"># Hallo PDFme!

Dies ist **fetter Text** und *kursiv*.

## Überschrift 2

- Liste Punkt 1
- Liste Punkt 2

Normaler Text bleibt selektierbar im PDF.</textarea>
</div>
<div class="preview">
  <div id="pdfContainer"></div>
  <div class="status" id="status">Lade PDF...</div>
</div>

<script>
  // Wait for the libraries to be loaded
  const checkLibrariesLoaded = setInterval(() => {
    if (window.BLANK_PDF && window.Viewer) {
      clearInterval(checkLibrariesLoaded);
      initializeApp();
    }
  }, 100);

  async function initializeApp() {
    const { BLANK_PDF, Viewer } = window;
    
    // Update status
    const status = document.getElementById('status');
    status.textContent = 'Initialisiere PDF-Viewer...';
    
    try {

      // Template configuration
      const template = {
        basePdf: BLANK_PDF,
        schemas: [
          {
            content: {
              type: 'image',
              position: { x: 10, y: 10 },
              width: 190,
              height: 277,
            }
          }
        ]
      };

      // Initialize the viewer
      const viewer = new Viewer({
        domContainer: document.getElementById('pdfContainer'),
        template,
        inputs: [{
          content: 'Bearbeite den Markdown-Text links, um die Vorschau zu aktualisieren.'
        }]
      });

      // Debug: Check available methods
      console.log('Viewer object:', viewer);
      console.log('Available methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(viewer)));

      // Update status
      status.textContent = 'Bereit';
      
      // Markdown to HTML conversion with html2canvas
      async function markdownToPdfContent(markdown) {
        // Convert markdown to HTML with modern styling
        const html = marked.parse(markdown);
        
        // Create temporary div for html2canvas with modern styling
        const tempDiv = document.createElement('div');
        // Set width to match PDF schema (190mm)
        // 190mm = 190 * 3.78 = ~718px at 96dpi
        const pdfWidthPx = 190 * 3.78;
        tempDiv.style.width = `${pdfWidthPx}px`;
        tempDiv.style.padding = '20px';
        tempDiv.style.boxSizing = 'border-box';
        tempDiv.style.background = '#ffffff';
        tempDiv.innerHTML = `
          <style>
            body {
              font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
              line-height: 1.5;
              color: #1a202c;
              background: #ffffff;
              margin: 0;
              padding: 0;
              font-size: 12px;
              word-break: break-word;
              width: 100%;
            }
            h1 {
              font-size: 1.8rem;
              font-weight: 700;
              color: #2d3748;
              margin-bottom: 0.8rem;
              border-bottom: 2px solid #4299e1;
              padding-bottom: 0.4rem;
              line-height: 1.3;
            }
            h2 {
              font-size: 1.4rem;
              font-weight: 600;
              color: #2d3748;
              margin-top: 1.8rem;
              margin-bottom: 0.8rem;
              border-left: 3px solid #4299e1;
              padding-left: 0.6rem;
              line-height: 1.3;
            }
            h3 {
              font-size: 1.2rem;
              font-weight: 600;
              color: #2d3748;
              margin-top: 1.3rem;
              margin-bottom: 0.6rem;
              line-height: 1.3;
            }
            p {
              margin-bottom: 1rem;
              color: #4a5568;
            }
            strong {
              font-weight: 600;
              color: #2d3748;
            }
            em {
              font-style: italic;
              color: #4a5568;
            }
            ul, ol {
              margin: 1rem 0;
              padding-left: 2rem;
            }
            li {
              margin-bottom: 0.5rem;
              color: #4a5568;
            }
            ul li {
              list-style-type: none;
              position: relative;
            }
            ul li::before {
              content: '▸';
              position: absolute;
              left: -1.2rem;
              color: #4299e1;
              font-weight: bold;
            }
            code {
              background: #f7fafc;
              border: 1px solid #e2e8f0;
              border-radius: 4px;
              padding: 0.2rem 0.4rem;
              font-family: 'Fira Code', 'Monaco', monospace;
              font-size: 0.9rem;
              color: #2d3748;
            }
            pre {
              background: #2d3748;
              color: #e2e8f0;
              border-radius: 8px;
              padding: 1rem;
              overflow-x: auto;
              margin: 1rem 0;
            }
            pre code {
              background: transparent;
              border: none;
              color: inherit;
              padding: 0;
            }
            blockquote {
              border-left: 4px solid #4299e1;
              margin: 1rem 0;
              padding: 1rem 1.5rem;
              background: #ebf8ff;
              color: #2c5282;
              border-radius: 0 8px 8px 0;
            }
            hr {
              border: none;
              height: 2px;
              background: linear-gradient(to right, transparent, #4299e1, transparent);
              margin: 2rem 0;
            }
          </style>
          ${html}
        `;
        
        tempDiv.style.position = 'absolute';
        tempDiv.style.left = '-9999px';
        tempDiv.style.width = `${pdfWidthPx}px`;  // Use PDF schema width
        tempDiv.style.backgroundColor = '#ffffff';
        document.body.appendChild(tempDiv);
        
        try {
          // Convert to canvas with PDF schema dimensions
        const canvas = await html2canvas(tempDiv, {
          width: pdfWidthPx,  // Use the same width as the PDF schema
          height: 1100,       // Slightly taller to fit more content
          backgroundColor: '#ffffff',
          scale: 2,           // Higher scale for better quality
          logging: false,     // Disable console logging for better performance
          useCORS: true       // Enable CORS for external resources
        });
          
          // Convert to data URL
          return canvas.toDataURL('image/png');
        } finally {
          // Clean up
          document.body.removeChild(tempDiv);
        }
      }

      // Handle markdown input
      const textarea = document.getElementById('markdown');
      textarea.addEventListener('input', async () => {
        try {
          const markdown = textarea.value;
          const content = await markdownToPdfContent(markdown);
          
          // Create new viewer instance with updated content
          const newViewer = new Viewer({
            domContainer: document.getElementById('pdfContainer'),
            template,
            inputs: [{ content }]
          });
          
          status.textContent = 'Aktualisiert';
          
          // Reset status after delay
          setTimeout(() => {
            if (status.textContent === 'Aktualisiert') {
              status.textContent = 'Bereit';
            }
          }, 2000);
          
        } catch (error) {
          console.error('Error updating PDF:', error);
          status.textContent = 'Fehler: ' + error.message;
        }
      });
      
      // Initial render
      textarea.dispatchEvent(new Event('input'));
      
    } catch (error) {
      console.error('Error initializing PDF viewer:', error);
      status.textContent = 'Fehler: ' + error.message;
    }
  }
</script>
